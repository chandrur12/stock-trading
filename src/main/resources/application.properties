spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


spring.kafka.producer.acks=all
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.properties.max.poll.interval.ms=60000
spring.kafka.listener.ack-mode=manual

# Listener Container Polling Customization
spring.kafka.listener.poll-timeout=2000ms
spring.kafka.listener.idle-between-polls=500ms
spring.kafka.listener.monitor-interval=60s
spring.kafka.listener.no-poll-threshold=3.5


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.application.name=stock-trading

server.port: 8081
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://localhost:3306/stock_trade
#spring.datasource.url=jdbc:mysql://hrmclouddb.c9wkcg0ysxx7.ap-south-1.rds.amazonaws.com:3306/hrmclouddb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.kafka.consumer.enable-auto-commit=false


