spring.application.name=stock-trading
server.port: 8086

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/stock_trade
spring.datasource.username=root
spring.datasource.password=root

#spring.datasource.password=root
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.generate-ddl=true
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl=true
spring.jpa.show-sql=true

# Set level to DEBUG for specific package, INFO for root
logging.level.root=INFO
logging.level.com.example=DEBUG
# Direct logs to a file and customize format
logging.file.name=logs/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# ---------------------------------- Kafka Configuration-------------------------------------

# Custom Topic Property
app.kafka.topic.orders=stock-orders-topic

# Kafka Broker & Schema Registry
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.schema.registry.url=http://localhost:8081

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# Consumer Configuration
spring.kafka.consumer.group-id=stock-trading-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

spring.kafka.consumer.enable-auto-commit=false

spring.kafka.producer.acks=all
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.properties.max.poll.interval.ms=60000
spring.kafka.listener.ack-mode=manual

# Listener Container Polling Customization
spring.kafka.listener.poll-timeout=2000ms
spring.kafka.listener.idle-between-polls=500ms
spring.kafka.listener.monitor-interval=60s
spring.kafka.listener.no-poll-threshold=3.5
spring.kafka.listener.type=batch

#old Consumer Produser serializer
#spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


# Producer (enables transactions & idempotence)
spring.kafka.producer.transaction-id-prefix=tx-order-

spring.devtools.restart.enabled=false
spring.kafka.consumer.properties.isolation.level=read_committed

